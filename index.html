<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e0a458">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Log">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161d;
    --panel:#1b212b;
    --panel-2:#212836;
    --line:#2a3140;
    --ink:#eef1f5;
    --muted:#8b93a3;
    --amber:#e0a458;
    --amber-dim:#5b4a30;
    --green:#7fae7f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--muted);
    font-size:0.95rem;
    margin:0 0 32px;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:32px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .stat .num{
    font-family:'Source Serif 4',serif;
    font-size:1.6rem;
    font-weight:600;
    color:var(--amber);
    line-height:1;
  }
  .stat .lbl{
    color:var(--muted);
    font-size:0.8rem;
    margin-top:6px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:'Source Serif 4',serif;
    font-size:1.1rem;
    font-weight:600;
    margin:0 0 16px;
  }
  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  form .full{grid-column:1/-1;}
  label{
    display:block;
    font-size:0.78rem;
    color:var(--muted);
    margin-bottom:5px;
  }
  input,textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    color:var(--ink);
    font-family:inherit;
    font-size:0.92rem;
  }
  input:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:60px;}
  button{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    border-radius:7px;
    border:1px solid transparent;
  }
  .btn-primary{
    background:var(--amber);
    color:#221a0c;
    padding:10px 18px;
    border:none;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 14px;
    font-weight:500;
  }
  .btn-ghost:hover{color:var(--ink);border-color:var(--muted);}
  .row-end{
    grid-column:1/-1;
    display:flex;
    justify-content:flex-end;
  }
  .heatmap{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(11px,1fr));
    gap:3px;
  }
  .cell{
    aspect-ratio:1;
    border-radius:2px;
    background:var(--panel-2);
  }
  .cell[data-l="1"]{background:#3c3423;}
  .cell[data-l="2"]{background:#6b5527;}
  .cell[data-l="3"]{background:#a3812f;}
  .cell[data-l="4"]{background:var(--amber);}
  .heatmap-legend{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:10px;
  }
  .legend-cell{width:10px;height:10px;border-radius:2px;}
  .entries{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .entry{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;padding-bottom:0;}
  .entry-main{flex:1;min-width:0;}
  .entry-date{
    font-size:0.75rem;
    color:var(--muted);
  }
  .entry-subject{
    font-weight:600;
    margin:2px 0;
  }
  .entry-notes{
    color:var(--muted);
    font-size:0.85rem;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .entry-side{
    text-align:right;
    white-space:nowrap;
  }
  .entry-mins{
    color:var(--amber);
    font-weight:600;
    font-size:0.9rem;
  }
  .entry-del{
    display:block;
    margin-top:6px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.75rem;
    cursor:pointer;
    padding:0;
  }
  .entry-del:hover{color:#c17;}
  .empty{
    color:var(--muted);
    font-size:0.9rem;
    text-align:center;
    padding:20px 0;
  }
  .footer-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:8px;
  }
  .goal-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .goal-row label{margin:0;white-space:nowrap;}
  .goal-row input{width:80px;}
  .week-bars{
    display:flex;
    align-items:flex-end;
    gap:10px;
    height:140px;
  }
  .week-bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    justify-content:flex-end;
    gap:6px;
  }
  .week-bar-track{
    width:100%;
    max-width:52px;
    height:100%;
    display:flex;
    align-items:flex-end;
    background:var(--panel-2);
    border-radius:6px;
    overflow:hidden;
    position:relative;
  }
  .week-bar-fill{
    width:100%;
    background:linear-gradient(180deg,var(--amber),#b9843c);
    border-radius:6px 6px 0 0;
    transition:height .3s ease;
  }
  .week-bar-fill.met{background:linear-gradient(180deg,var(--green),#547a54);}
  .week-bar-fill.current{outline:2px solid var(--ink);outline-offset:-2px;}
  .week-bar-label{
    font-size:0.7rem;
    color:var(--muted);
    text-align:center;
    line-height:1.2;
  }
  .week-bar-mins{
    font-size:0.72rem;
    color:var(--ink);
    font-weight:600;
  }
  .stopwatch{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }
  .sw-time{
    font-family:'Source Serif 4',serif;
    font-size:2.4rem;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--amber);
  }
  .sw-controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .filter-tab{
    background:var(--panel-2);
    color:var(--muted);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:20px;
    font-size:0.8rem;
    font-weight:500;
    cursor:pointer;
    font-family:inherit;
  }
  .filter-tab.active{
    background:var(--amber);
    color:#221a0c;
    border-color:var(--amber);
    font-weight:600;
  }
  .group-header{
    font-size:0.78rem;
    color:var(--muted);
    font-weight:600;
    text-transform:none;
    margin:18px 0 4px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .group-header:first-child{border-top:none;padding-top:0;margin-top:0;}
  .group-total{color:var(--amber);font-weight:600;}
  select{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 10px;
    color:var(--ink);
    font-family:inherit;
    font-size:0.9rem;
  }
  .tag-picker,.tag-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag-chip{
    display:inline-flex;align-items:center;
    border:1px solid var(--c);
    border-radius:20px;
    overflow:hidden;
  }
  .tag-chip button{
    background:transparent;border:none;color:var(--ink);
    font-family:inherit;font-size:0.8rem;font-weight:500;
    padding:5px 11px;cursor:pointer;
  }
  .tag-chip button.tag-x{padding:5px 8px 5px 2px;color:var(--muted);font-size:0.85rem;}
  .tag-chip button.tag-x:hover{color:#d9776b;}
  .tag-chip.on{background:var(--c);}
  .tag-chip.on button{color:#161616;font-weight:600;}
  .tag-count{opacity:.7;margin-left:4px;font-weight:400;}
  .tag-grid-wrap{overflow-x:auto;padding-bottom:6px;}
  .tag-grid{display:grid;gap:3px;align-items:center;width:max-content;}
  .tg-label{font-size:0.78rem;padding-right:8px;position:sticky;left:0;background:var(--panel);z-index:1;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tg-head{font-size:0.62rem;color:var(--muted);text-align:center;line-height:1.15;}
  .tg-head.today{color:var(--amber);font-weight:700;}
  .tg-cell{width:22px;height:22px;border-radius:4px;background:var(--panel-2);}
  .tag-days{margin-top:14px;font-size:0.85rem;}
  .tag-days-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);}
  .tag-days-row span:last-child{color:var(--muted);}
  .entry-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .mini-tag{font-size:0.68rem;padding:2px 8px;border-radius:10px;background:var(--c);color:#161616;font-weight:600;}
  .tag-note{font-size:0.8rem;color:var(--muted);margin-bottom:12px;}
  .tag-note button{background:none;border:none;color:var(--amber);cursor:pointer;font-family:inherit;font-size:0.8rem;padding:0 0 0 6px;}
  .embed-wrap{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio:16/9;
    margin-top:10px;
    border-radius:8px;
    overflow:hidden;
    background:#000;
  }
  .embed-wrap iframe{
    position:absolute;top:0;left:0;width:100%;height:100%;border:0;
  }
  .link-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:6px 12px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--amber);
    font-size:0.8rem;
    font-weight:500;
    text-decoration:none;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .link-chip:hover{border-color:var(--amber);}
  .subj-row{margin-bottom:16px;}
  .subj-row:last-child{margin-bottom:0;}
  .subj-top{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:5px;font-size:0.88rem;
  }
  .subj-name{font-weight:600;}
  .subj-mins{color:var(--muted);font-size:0.8rem;}
  .subj-track{
    width:100%;height:9px;background:var(--panel-2);
    border-radius:5px;overflow:hidden;
  }
  .subj-fill{height:100%;border-radius:5px;transition:width .3s ease;}
  .subj-fill.met{filter:saturate(1.15);}
  .subj-goal-row{
    display:flex;align-items:center;gap:8px;margin-top:6px;
  }
  .subj-goal-row label{margin:0;font-size:0.72rem;white-space:nowrap;}
  .subj-goal-input{width:60px;padding:5px 7px;font-size:0.8rem;}
  .subj-goal-note{font-size:0.72rem;color:var(--muted);}
  .entry-edit{
    display:block;margin-top:6px;background:none;border:none;
    color:var(--amber);font-size:0.75rem;cursor:pointer;padding:0;
  }
  .entry-edit:hover{text-decoration:underline;}
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#f6f4ef;
      --panel:#ffffff;
      --panel-2:#f1efe9;
      --line:#e2ddd1;
      --ink:#211d15;
      --muted:#7a7466;
      --amber-dim:#e9d8b8;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Study Log</h1>
  <p class="sub">A private record of days studied and time spent. Stored only in this browser.</p>

  <div class="stats">
    <div class="stat"><div class="num" id="statHours">0</div><div class="lbl">hours logged</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">day streak</div></div>
    <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">days this year</div></div>
  </div>

  <div class="panel" id="monthPanel">
    <h2>This month, week by week</h2>
    <div class="goal-row">
      <label for="goalInput">Daily goal</label>
      <input type="number" id="goalInput" min="0" step="5">
      <span style="color:var(--muted);font-size:0.85rem;">minutes/day</span>
    </div>
    <div class="week-bars" id="weekBars"></div>
  </div>

  <div class="panel" id="subjectPanel">
    <h2>By subject</h2>
    <div class="goal-row">
      <label for="subjRange">Range</label>
      <select id="subjRange">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
        <option value="month" selected>This month</option>
      </select>
    </div>
    <div id="subjectBreakdown"></div>
  </div>

  <div class="panel">
    <h2>Tag a day</h2>
    <div class="goal-row">
      <input type="date" id="tagDate" style="width:auto" aria-label="Date to tag">
      <input type="text" id="newTag" placeholder="New tag, e.g. chores" maxlength="24" style="width:190px">
      <button type="button" class="btn-ghost" id="addTagBtn">Add tag</button>
    </div>
    <div class="tag-picker" id="tagPicker"></div>
  </div>

  <div class="panel">
    <h2>Tags over time</h2>
    <div class="goal-row">
      <label for="tagRange">Range</label>
      <select id="tagRange">
        <option value="7">Last 7 days</option>
        <option value="14" selected>Last 14 days</option>
        <option value="30">Last 30 days</option>
        <option value="month">This month</option>
      </select>
    </div>
    <div class="tag-filter" id="tagFilter"></div>
    <div class="tag-grid-wrap"><div class="tag-grid" id="tagGrid"></div></div>
    <div class="tag-days" id="tagDays"></div>
  </div>

  <div class="panel">
    <h2>Stopwatch</h2>
    <div class="stopwatch">
      <div class="sw-time" id="swTime">00:00:00</div>
      <div class="sw-controls">
        <button type="button" class="btn-primary" id="swStart">Start</button>
        <button type="button" class="btn-ghost" id="swPause" style="display:none">Pause</button>
        <button type="button" class="btn-ghost" id="swReset">Reset</button>
        <button type="button" class="btn-ghost" id="swUse">Use this time</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Log a session</h2>
    <form id="logForm">
      <div>
        <label for="fDate">Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div>
        <label for="fMinutes">Minutes</label>
        <input type="number" id="fMinutes" min="1" step="1" placeholder="45" required>
      </div>
      <div class="full">
        <label for="fSubject">Subject</label>
        <input type="text" id="fSubject" placeholder="e.g. AP World History — Unit 3" required>
      </div>
      <div class="full">
        <label for="fNotes">What you studied</label>
        <textarea id="fNotes" placeholder="Optional — key topics, what clicked, what to revisit"></textarea>
      </div>
      <div class="full">
        <label for="fLink">Link (optional)</label>
        <input type="url" id="fLink" placeholder="YouTube video, article, resource — any URL">
      </div>
      <div class="row-end">
        <button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none">Cancel edit</button>
        <button type="submit" class="btn-primary" id="submitBtn">Add entry</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>This year</h2>
    <div class="heatmap" id="heatmap"></div>
    <div class="heatmap-legend">
      <span>Less</span>
      <span class="legend-cell" style="background:var(--panel-2)"></span>
      <span class="legend-cell" style="background:#3c3423"></span>
      <span class="legend-cell" style="background:#6b5527"></span>
      <span class="legend-cell" style="background:#a3812f"></span>
      <span class="legend-cell" style="background:var(--amber)"></span>
      <span>More</span>
    </div>
  </div>

  <div class="panel">
    <h2>Entries</h2>
    <div class="filter-tabs" id="filterTabs">
      <button type="button" class="filter-tab active" data-range="week">This week</button>
      <button type="button" class="filter-tab" data-range="month">This month</button>
      <button type="button" class="filter-tab" data-range="all">All time</button>
    </div>
    <div class="tag-note" id="entriesTagNote"></div>
    <div class="entries" id="entries"></div>
  </div>

  <div class="footer-actions">
    <button class="btn-ghost" id="exportBtn">Export backup (.json)</button>
    <button class="btn-ghost" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'study-log-entries';
  const GOAL_KEY = 'study-log-goal-minutes';

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(entries){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('Could not save', e); }
  }
  function loadGoal(){
    const raw = localStorage.getItem(GOAL_KEY);
    const n = parseInt(raw, 10);
    return isNaN(n) ? 30 : n;
  }
  function saveGoal(mins){
    try{ localStorage.setItem(GOAL_KEY, String(mins)); }catch(e){}
  }

  let entries = load();
  let goalMinutes = loadGoal();
  let currentRange = 'week';
  let currentTag = null;
  const SUBJ_GOALS_KEY = 'study-log-subject-goals';
  function loadSubjGoals(){
    try{
      const r = JSON.parse(localStorage.getItem(SUBJ_GOALS_KEY));
      return r && typeof r === 'object' ? r : {};
    }catch(e){ return {}; }
  }
  function saveSubjGoals(){
    try{ localStorage.setItem(SUBJ_GOALS_KEY, JSON.stringify(subjectGoals)); }catch(e){}
  }
  let subjectGoals = loadSubjGoals();
  let editingId = null;
  const TAGS_KEY = 'study-log-tags';
  const PALETTE = ['#e0a458','#7fae7f','#6fa8dc','#c98bb9','#d9776b','#8fbfc0','#b8b06a','#a58fd6'];
  function loadTags(){
    try{
      const r = JSON.parse(localStorage.getItem(TAGS_KEY));
      if(r && Array.isArray(r.tags) && r.days) return r;
    }catch(e){}
    return {tags:[], days:{}};
  }
  function saveTags(){
    try{ localStorage.setItem(TAGS_KEY, JSON.stringify(tagData)); }catch(e){}
  }
  let tagData = loadTags();

  const fDate = document.getElementById('fDate');
  const fMinutes = document.getElementById('fMinutes');
  const fSubject = document.getElementById('fSubject');
  const fNotes = document.getElementById('fNotes');
  const fLink = document.getElementById('fLink');
  const form = document.getElementById('logForm');
  const entriesEl = document.getElementById('entries');
  const heatmapEl = document.getElementById('heatmap');
  const statHours = document.getElementById('statHours');
  const statStreak = document.getElementById('statStreak');
  const statDays = document.getElementById('statDays');
  const weekBarsEl = document.getElementById('weekBars');
  const goalInput = document.getElementById('goalInput');
  const filterTabs = document.getElementById('filterTabs');
  const swTime = document.getElementById('swTime');
  const swStart = document.getElementById('swStart');
  const swPause = document.getElementById('swPause');
  const swReset = document.getElementById('swReset');
  const swUse = document.getElementById('swUse');
  const tagDate = document.getElementById('tagDate');
  const newTag = document.getElementById('newTag');
  const addTagBtn = document.getElementById('addTagBtn');
  const tagPicker = document.getElementById('tagPicker');
  const tagRange = document.getElementById('tagRange');
  const tagFilter = document.getElementById('tagFilter');
  const tagGrid = document.getElementById('tagGrid');
  const tagDaysEl = document.getElementById('tagDays');
  const entriesTagNote = document.getElementById('entriesTagNote');
  const subjRange = document.getElementById('subjRange');
  const subjectBreakdown = document.getElementById('subjectBreakdown');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const submitBtn = document.getElementById('submitBtn');

  subjRange.addEventListener('change', renderSubjects);
  subjectBreakdown.addEventListener('change', function(e){
    const inp = e.target.closest('.subj-goal-input');
    if(!inp) return;
    const subj = decodeURIComponent(inp.dataset.subj);
    const v = parseInt(inp.value, 10);
    subjectGoals[subj] = isNaN(v) || v < 0 ? 0 : v;
    inp.value = subjectGoals[subj];
    saveSubjGoals();
    renderSubjects();
  });

  tagDate.value = isoDay(new Date());
  tagDate.addEventListener('change', renderTagPicker);
  tagRange.addEventListener('change', renderTags);
  addTagBtn.addEventListener('click', addTag);
  newTag.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); addTag(); } });

  function hasTag(iso, name){ return (tagData.days[iso] || []).indexOf(name) !== -1; }
  function tagColor(name){
    const t = tagData.tags.find(t => t.name === name);
    return t ? t.color : '#888';
  }
  function toggleDayTag(iso, name){
    let arr = tagData.days[iso] || [];
    arr = arr.indexOf(name) !== -1 ? arr.filter(n => n !== name) : arr.concat(name);
    if(arr.length) tagData.days[iso] = arr; else delete tagData.days[iso];
    saveTags();
    render();
  }
  function addTag(){
    const name = newTag.value.trim();
    if(!name || !tagDate.value) return;
    let existing = tagData.tags.find(t => t.name.toLowerCase() === name.toLowerCase());
    if(!existing){
      existing = {name: name, color: PALETTE[tagData.tags.length % PALETTE.length]};
      tagData.tags.push(existing);
    }
    if(!hasTag(tagDate.value, existing.name)){
      tagData.days[tagDate.value] = (tagData.days[tagDate.value] || []).concat(existing.name);
    }
    newTag.value = '';
    saveTags();
    render();
  }
  function deleteTag(name){
    if(!confirm('Delete the tag "' + name + '" from every day?')) return;
    tagData.tags = tagData.tags.filter(t => t.name !== name);
    Object.keys(tagData.days).forEach(k => {
      tagData.days[k] = tagData.days[k].filter(n => n !== name);
      if(!tagData.days[k].length) delete tagData.days[k];
    });
    if(currentTag === name) currentTag = null;
    saveTags();
    render();
  }
  function makeChip(t, on){
    const chip = document.createElement('span');
    chip.className = 'tag-chip' + (on ? ' on' : '');
    chip.style.setProperty('--c', t.color);
    return chip;
  }
  function renderTagPicker(){
    tagPicker.innerHTML = '';
    if(!tagData.tags.length){
      tagPicker.innerHTML = '<div class="empty" style="padding:4px 0">No tags yet. Type a name above and hit Add tag.</div>';
      return;
    }
    tagData.tags.forEach(t => {
      const chip = makeChip(t, hasTag(tagDate.value, t.name));
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = t.name;
      b.addEventListener('click', () => toggleDayTag(tagDate.value, t.name));
      const x = document.createElement('button');
      x.type = 'button';
      x.className = 'tag-x';
      x.textContent = '\u00d7';
      x.title = 'Delete tag';
      x.addEventListener('click', () => deleteTag(t.name));
      chip.appendChild(b);
      chip.appendChild(x);
      tagPicker.appendChild(chip);
    });
  }
  function getRangeDaysFor(v){
    const today = new Date();
    const days = [];
    if(v === 'month'){
      const last = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
      for(let i = 1; i <= last; i++) days.push(new Date(today.getFullYear(), today.getMonth(), i));
    } else {
      const n = parseInt(v, 10);
      for(let i = n-1; i >= 0; i--) days.push(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i));
    }
    return days;
  }
  function getRangeDays(){ return getRangeDaysFor(tagRange.value); }

  function renderSubjects(){
    const days = getRangeDaysFor(subjRange.value);
    const isoSet = new Set(days.map(isoDay));
    const totals = {};
    entries.forEach(en => {
      if(!isoSet.has(en.date)) return;
      totals[en.subject] = (totals[en.subject] || 0) + en.minutes;
    });
    const subjList = Object.keys(totals).sort((a,b) => totals[b] - totals[a]);
    subjectBreakdown.innerHTML = '';
    if(!subjList.length){
      subjectBreakdown.innerHTML = '<div class="empty">Nothing logged in this range yet.</div>';
      return;
    }
    const maxVal = Math.max(...subjList.map(s => totals[s]));
    const rangeDayCount = days.length;
    subjList.forEach((subj, i) => {
      const mins = totals[subj];
      const pct = Math.round((mins / maxVal) * 100);
      const goal = subjectGoals[subj] || 0;
      const goalTotal = goal * rangeDayCount;
      const met = goalTotal > 0 && mins >= goalTotal;
      const color = PALETTE[i % PALETTE.length];
      const row = document.createElement('div');
      row.className = 'subj-row';
      row.innerHTML =
        '<div class="subj-top"><span class="subj-name"></span><span class="subj-mins"></span></div>' +
        '<div class="subj-track"><div class="subj-fill' + (met ? ' met' : '') + '" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<div class="subj-goal-row"><label>Daily goal</label><input type="number" min="0" step="5" class="subj-goal-input" data-subj="' + encodeURIComponent(subj) + '" value="' + goal + '"><span class="subj-goal-note"></span></div>';
      row.querySelector('.subj-name').textContent = subj;
      row.querySelector('.subj-mins').textContent = mins + ' min';
      row.querySelector('.subj-goal-note').textContent = goalTotal > 0 ? (mins + '/' + goalTotal + ' min goal') : 'min/day \u00b7 0 = no goal';
      subjectBreakdown.appendChild(row);
    });
  }

  function renderTags(){
    renderTagPicker();
    tagFilter.innerHTML = '';
    tagGrid.innerHTML = '';
    tagDaysEl.innerHTML = '';
    if(!tagData.tags.length) return;
    const days = getRangeDays();
    const isos = days.map(isoDay);
    const todayIso = isoDay(new Date());

    // filter chips with counts (click to filter the grid list and entries by tag)
    tagData.tags.forEach(t => {
      const count = isos.filter(iso => hasTag(iso, t.name)).length;
      const chip = makeChip(t, currentTag === t.name);
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = t.name;
      const c = document.createElement('span');
      c.className = 'tag-count';
      c.textContent = count;
      b.appendChild(c);
      b.addEventListener('click', () => {
        currentTag = currentTag === t.name ? null : t.name;
        renderTags();
        renderEntries();
      });
      chip.appendChild(b);
      tagFilter.appendChild(chip);
    });

    // grid: rows = tags, columns = days
    tagGrid.style.gridTemplateColumns = '96px repeat(' + days.length + ', 22px)';
    tagGrid.appendChild(document.createElement('div'));
    days.forEach((d, i) => {
      const h = document.createElement('div');
      h.className = 'tg-head' + (isos[i] === todayIso ? ' today' : '');
      h.textContent = d.toLocaleDateString(undefined, {weekday:'narrow'}) + '\n' + d.getDate();
      h.style.whiteSpace = 'pre';
      tagGrid.appendChild(h);
    });
    tagData.tags.forEach(t => {
      if(currentTag && currentTag !== t.name) return;
      const l = document.createElement('div');
      l.className = 'tg-label';
      l.textContent = t.name;
      l.style.color = t.color;
      tagGrid.appendChild(l);
      isos.forEach(iso => {
        const cell = document.createElement('div');
        cell.className = 'tg-cell';
        if(hasTag(iso, t.name)) cell.style.background = t.color;
        cell.title = iso + ' \u2013 ' + t.name;
        tagGrid.appendChild(cell);
      });
    });

    // list of days for the selected tag
    if(currentTag){
      const minutesByDate = {};
      entries.forEach(en => { minutesByDate[en.date] = (minutesByDate[en.date] || 0) + en.minutes; });
      const hits = days.filter((d, i) => hasTag(isos[i], currentTag)).reverse();
      const head = document.createElement('div');
      head.style.cssText = 'margin-bottom:6px;color:var(--muted)';
      head.textContent = hits.length + ' day' + (hits.length === 1 ? '' : 's') + ' tagged \u201c' + currentTag + '\u201d in this range';
      tagDaysEl.appendChild(head);
      hits.forEach(d => {
        const iso = isoDay(d);
        const row = document.createElement('div');
        row.className = 'tag-days-row';
        const a = document.createElement('span');
        a.textContent = d.toLocaleDateString(undefined, {weekday:'long', month:'short', day:'numeric'});
        const m = document.createElement('span');
        m.textContent = minutesByDate[iso] ? minutesByDate[iso] + ' min studied' : '';
        row.appendChild(a);
        row.appendChild(m);
        tagDaysEl.appendChild(row);
      });
    }
  }

  fDate.value = isoDay(new Date());
  goalInput.value = goalMinutes;
  goalInput.addEventListener('change', function(){
    const v = parseInt(goalInput.value, 10);
    goalMinutes = isNaN(v) || v < 0 ? 0 : v;
    goalInput.value = goalMinutes;
    saveGoal(goalMinutes);

  filterTabs.addEventListener('click', function(e){
    const btn = e.target.closest('.filter-tab');
    if(!btn) return;
    currentRange = btn.dataset.range;
    Array.from(filterTabs.children).forEach(c => c.classList.toggle('active', c === btn));
    renderEntries();

  // --- Stopwatch ---
  let swElapsedMs = 0;
  let swRunning = false;
  let swStartedAt = 0;
  let swInterval = null;

  function fmtStopwatch(ms){
    const totalSec = Math.floor(ms/1000);
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    const pad = n => String(n).padStart(2,'0');
    return pad(h)+':'+pad(m)+':'+pad(s);
  }
  function swTick(){
    const now = swElapsedMs + (Date.now() - swStartedAt);
    swTime.textContent = fmtStopwatch(now);
  }
  swStart.addEventListener('click', function(){
    swRunning = true;
    swStartedAt = Date.now();
    swInterval = setInterval(swTick, 1000);
    swStart.style.display = 'none';
    swPause.style.display = '';
  });
  swPause.addEventListener('click', function(){
    swRunning = false;
    swElapsedMs += Date.now() - swStartedAt;
    clearInterval(swInterval);
    swTime.textContent = fmtStopwatch(swElapsedMs);
    swPause.style.display = 'none';
    swStart.style.display = '';
    swStart.textContent = 'Resume';
  });
  swReset.addEventListener('click', function(){
    swRunning = false;
    swElapsedMs = 0;
    clearInterval(swInterval);
    swTime.textContent = fmtStopwatch(0);
    swPause.style.display = 'none';
    swStart.style.display = '';
    swStart.textContent = 'Start';
  });
  swUse.addEventListener('click', function(){
    const currentMs = swRunning ? swElapsedMs + (Date.now() - swStartedAt) : swElapsedMs;
    const mins = Math.max(1, Math.round(currentMs/60000));
    fMinutes.value = mins;
    fDate.value = isoDay(new Date());
    fSubject.focus();
    fSubject.scrollIntoView({behavior:'smooth', block:'center'});
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!fDate.value || !fMinutes.value || !fSubject.value.trim()) return;
    if(editingId){
      const en = entries.find(x => x.id === editingId);
      if(en){
        en.date = fDate.value;
        en.minutes = parseInt(fMinutes.value, 10);
        en.subject = fSubject.value.trim();
        en.notes = fNotes.value.trim();
        en.link = fLink.value.trim();
      }
      stopEdit();
    } else {
      entries.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        date: fDate.value,
        minutes: parseInt(fMinutes.value, 10),
        subject: fSubject.value.trim(),
        notes: fNotes.value.trim(),
        link: fLink.value.trim()
      });
    }
    entries.sort((a,b)=> b.date.localeCompare(a.date));
    save(entries);
    fMinutes.value = '';
    fSubject.value = '';
    fNotes.value = '';
    fLink.value = '';
    fDate.value = isoDay(new Date());
    render();
  });

  function startEdit(id){
    const en = entries.find(x => x.id === id);
    if(!en) return;
    editingId = id;
    fDate.value = en.date;
    fMinutes.value = en.minutes;
    fSubject.value = en.subject;
    fNotes.value = en.notes || '';
    fLink.value = en.link || '';
    submitBtn.textContent = 'Save changes';
    cancelEditBtn.style.display = '';

  cancelEditBtn.addEventListener('click', function(){

    fMinutes.value = '';
    fSubject.value = '';
    fNotes.value = '';
    fLink.value = '';
    fDate.value = isoDay(new Date());
  });

  entriesEl.addEventListener('click', function(e){
    const editBtn = e.target.closest('.entry-edit');
    if(editBtn){ startEdit(editBtn.dataset.id); return; }
    const delBtn = e.target.closest('.entry-del');
    if(!delBtn) return;
    const id = delBtn.dataset.id;
    entries = entries.filter(en => en.id !== id);
    if(editingId === id){
      stopEdit();
      fMinutes.value = ''; fSubject.value = ''; fNotes.value = ''; fLink.value = '';
      fDate.value = isoDay(new Date());
    }
    save(entries);
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    const blob = new Blob([JSON.stringify({version:2, entries:entries, tags:tagData, goal:goalMinutes}, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'study-log-backup-' + isoDay(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function(){
    importFile.click();
  });
  importFile.addEventListener('change', function(){
    const file = importFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const parsed = JSON.parse(reader.result);
        const imported = Array.isArray(parsed) ? parsed : parsed.entries;
        if(!Array.isArray(imported)) throw new Error('bad format');
        if(parsed && parsed.tags && Array.isArray(parsed.tags.tags) && parsed.tags.days){
          parsed.tags.tags.forEach(t => {
            if(t && t.name && !tagData.tags.some(x => x.name === t.name)) tagData.tags.push({name:String(t.name), color:t.color || '#888'});
          });
          Object.keys(parsed.tags.days).forEach(k => {
            const cur = tagData.days[k] || [];
            const add = (parsed.tags.days[k] || []).filter(n => cur.indexOf(n) === -1);
            if(cur.length + add.length) tagData.days[k] = cur.concat(add);
          });
          saveTags();
        }
        const byId = {};
        entries.concat(imported).forEach(en => { if(en && en.id) byId[en.id] = en; });
        entries = Object.values(byId).sort((a,b)=> b.date.localeCompare(a.date));
        save(entries);
        render();
      }catch(err){
        alert('Could not read that file as a study log backup.');
      }
    };
    reader.readAsText(file);
    importFile.value = '';
  });

  function formatDate(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  }

  function render(){
    // stats
    const totalMinutes = entries.reduce((s,en)=> s + en.minutes, 0);
    statHours.textContent = (totalMinutes/60).toFixed(1);

    const uniqueDates = Array.from(new Set(entries.map(en=>en.date))).sort();
    const thisYear = new Date().getFullYear().toString();
    statDays.textContent = uniqueDates.filter(d => d.startsWith(thisYear)).length;

    // streak: consecutive days up to today
    const dateSet = new Set(uniqueDates);
    let streak = 0;
    let cursor = new Date();
    while(true){
      const iso = isoDay(cursor);
      if(dateSet.has(iso)){
        streak++;
        cursor.setDate(cursor.getDate()-1);
      } else if (streak===0 && iso === isoDay(new Date())) {
        // today has no entry yet, check yesterday onward without breaking
        cursor.setDate(cursor.getDate()-1);
        const y = isoDay(cursor);
        if(!dateSet.has(y)) break;
      } else {
        break;
      }
    }
    statStreak.textContent = streak;

    // heatmap for current year
    const minutesByDate = {};
    entries.forEach(en=>{ minutesByDate[en.date] = (minutesByDate[en.date]||0) + en.minutes; });
    heatmapEl.innerHTML = '';
    const year = new Date().getFullYear();
    const start = new Date(year,0,1);
    const end = new Date(year,11,31);
    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      const iso = isoDay(d);
      const mins = minutesByDate[iso] || 0;
      let level = 0;
      if(mins>0) level=1;
      if(mins>=30) level=2;
      if(mins>=60) level=3;
      if(mins>=120) level=4;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.l = level;
      cell.title = iso + (mins ? ' \u2014 ' + mins + ' min' : '') + ((tagData.days[iso] || []).length ? ' [' + tagData.days[iso].join(', ') + ']' : '');
      heatmapEl.appendChild(cell);
    }

    renderWeekBars();
    renderSubjects();
    renderTags();
    renderEntries();
  }

  // Monday-based start of week
  function startOfWeek(d){
    const x = new Date(d);
    const day = (x.getDay() + 6) % 7; // 0 = Monday
    x.setDate(x.getDate() - day);
    x.setHours(0,0,0,0);
    return x;
  }
  function isoDay(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

  function renderWeekBars(){
    const minutesByDate = {};
    entries.forEach(en=>{ minutesByDate[en.date] = (minutesByDate[en.date]||0) + en.minutes; });

    const today = new Date();
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const monthEnd = new Date(today.getFullYear(), today.getMonth()+1, 0);
    const firstWeekStart = startOfWeek(monthStart);
    const weeks = [];
    for(let ws = new Date(firstWeekStart); ws <= monthEnd; ws.setDate(ws.getDate()+7)){
      const weekStart = new Date(ws);
      const weekEnd = new Date(ws); weekEnd.setDate(weekEnd.getDate()+6);
      let total = 0;
      let containsToday = false;
      for(let d = new Date(weekStart); d <= weekEnd; d.setDate(d.getDate()+1)){
        if(d.getMonth() !== today.getMonth()) continue; // only count days within this month
        const iso = isoDay(d);
        total += minutesByDate[iso] || 0;
        if(iso === isoDay(today)) containsToday = true;
      }
      weeks.push({weekStart, weekEnd, total, containsToday});
    }

    const goalForWeek = goalMinutes * 7;
    const maxVal = Math.max(goalForWeek, ...weeks.map(w=>w.total), 1);

    weekBarsEl.innerHTML = '';
    weeks.forEach(w=>{
      const pct = Math.min(100, Math.round((w.total / maxVal) * 100));
      const met = goalForWeek > 0 && w.total >= goalForWeek;
      const col = document.createElement('div');
      col.className = 'week-bar-col';
      const label = w.weekStart.toLocaleDateString(undefined,{month:'short',day:'numeric'}) +
        '\u2013' + w.weekEnd.toLocaleDateString(undefined,{day:'numeric'});
      col.innerHTML =
        '<div class="week-bar-mins">' + w.total + 'm</div>' +
        '<div class="week-bar-track"><div class="week-bar-fill' + (met?' met':'') + (w.containsToday?' current':'') + '" style="height:' + pct + '%"></div></div>' +
        '<div class="week-bar-label"></div>';
      col.querySelector('.week-bar-label').textContent = (w.containsToday ? 'This week \u2022 ' : '') + label;
      weekBarsEl.appendChild(col);
    });
  }

  function renderEntries(){
    entriesEl.innerHTML = '';
    if(entries.length === 0){
      entriesEl.innerHTML = '<div class="empty">No sessions logged yet. Add your first one above.</div>';
      return;
    }
    const today = new Date();
    const todayIso = isoDay(today);
    const weekStartIso = isoDay(startOfWeek(today));
    const monthPrefix = todayIso.slice(0,7);

    let visible = entries;
    if(currentRange === 'week'){
      visible = entries.filter(en => en.date >= weekStartIso && en.date <= todayIso);
    } else if(currentRange === 'month'){
      visible = entries.filter(en => en.date.startsWith(monthPrefix));
    }

    if(currentTag){
      visible = visible.filter(en => hasTag(en.date, currentTag));
    }
    entriesTagNote.innerHTML = '';
    if(currentTag){
      entriesTagNote.appendChild(document.createTextNode('Showing days tagged \u201c' + currentTag + '\u201d'));
      const clr = document.createElement('button');
      clr.type = 'button';
      clr.textContent = 'Clear';
      clr.addEventListener('click', () => { currentTag = null; renderTags(); renderEntries(); });
      entriesTagNote.appendChild(clr);
    }

    if(visible.length === 0){
      entriesEl.innerHTML = '<div class="empty">Nothing logged in this range yet.</div>';
      return;
    }

    if(currentRange === 'week'){
      visible.forEach(en => entriesEl.appendChild(buildEntryRow(en)));
      return;
    }

    // group by week for month/all views
    const groups = new Map();
    visible.forEach(en=>{
      const d = new Date(en.date + 'T00:00:00');
      const ws = isoDay(startOfWeek(d));
      if(!groups.has(ws)) groups.set(ws, []);
      groups.get(ws).push(en);
    });
    const sortedWeeks = Array.from(groups.keys()).sort().reverse();
    sortedWeeks.forEach(ws=>{
      const group = groups.get(ws);
      const total = group.reduce((s,en)=>s+en.minutes,0);
      const wsDate = new Date(ws + 'T00:00:00');
      const weLabel = new Date(wsDate); weLabel.setDate(weLabel.getDate()+6);
      const header = document.createElement('div');
      header.className = 'group-header';
      header.textContent = 'Week of ' + wsDate.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' \u2013 ' + weLabel.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + '  ';
      const totalSpan = document.createElement('span');
      totalSpan.className = 'group-total';
      totalSpan.textContent = total + ' min total';
      header.appendChild(totalSpan);
      entriesEl.appendChild(header);
      group.forEach(en => entriesEl.appendChild(buildEntryRow(en)));
    });
  }

  function youtubeId(url){
    if(!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  function buildEntryRow(en){
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML =
      '<div class="entry-main">' +
        '<div class="entry-date">' + formatDate(en.date) + '</div>' +
        '<div class="entry-subject"></div>' +
        (en.notes ? '<div class="entry-notes"></div>' : '') +
      '</div>' +
      '<div class="entry-side">' +
        '<div class="entry-mins">' + en.minutes + ' min</div>' +
        '<button type="button" class="entry-edit" data-id="' + en.id + '">Edit</button>' +
        '<button type="button" class="entry-del" data-id="' + en.id + '">Delete</button>' +
      '</div>';
    row.querySelector('.entry-subject').textContent = en.subject;
    if(en.notes) row.querySelector('.entry-notes').textContent = en.notes;
    if(en.link){
      const yt = youtubeId(en.link);
      if(yt){
        const ew = document.createElement('div');
        ew.className = 'embed-wrap';
        const ifr = document.createElement('iframe');
        ifr.src = 'https://www.youtube-nocookie.com/embed/' + yt;
        ifr.loading = 'lazy';
        ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        ifr.allowFullscreen = true;
        ew.appendChild(ifr);
        row.querySelector('.entry-main').appendChild(ew);
      } else {
        const a = document.createElement('a');
        a.className = 'link-chip';
        a.href = en.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = '\ud83d\udd17 ' + en.link.replace(/^https?:\/\//,'');
        row.querySelector('.entry-main').appendChild(a);
      }
    }
    const dayTags = tagData.days[en.date] || [];
    if(dayTags.length){
      const wrap = document.createElement('div');
      wrap.className = 'entry-tags';
      dayTags.forEach(n => {
        const m = document.createElement('span');
        m.className = 'mini-tag';
        m.style.setProperty('--c', tagColor(n));
        m.textContent = n;
        wrap.appendChild(m);
      });
      row.querySelector('.entry-main').appendChild(wrap);
    }
    return row;
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

  render();
})();
</script>
</body>
</html>
