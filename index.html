<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12161d;
    --panel:#1b212b;
    --panel-2:#212836;
    --line:#2a3140;
    --ink:#eef1f5;
    --muted:#8b93a3;
    --amber:#e0a458;
    --amber-dim:#5b4a30;
    --green:#7fae7f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--muted);
    font-size:0.95rem;
    margin:0 0 32px;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:32px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
  }
  .stat .num{
    font-family:'Source Serif 4',serif;
    font-size:1.6rem;
    font-weight:600;
    color:var(--amber);
    line-height:1;
  }
  .stat .lbl{
    color:var(--muted);
    font-size:0.8rem;
    margin-top:6px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:'Source Serif 4',serif;
    font-size:1.1rem;
    font-weight:600;
    margin:0 0 16px;
  }
  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  form .full{grid-column:1/-1;}
  label{
    display:block;
    font-size:0.78rem;
    color:var(--muted);
    margin-bottom:5px;
  }
  input,textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    color:var(--ink);
    font-family:inherit;
    font-size:0.92rem;
  }
  input:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:60px;}
  button{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
    border-radius:7px;
    border:1px solid transparent;
  }
  .btn-primary{
    background:var(--amber);
    color:#221a0c;
    padding:10px 18px;
    border:none;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:8px 14px;
    font-weight:500;
  }
  .btn-ghost:hover{color:var(--ink);border-color:var(--muted);}
  .row-end{
    grid-column:1/-1;
    display:flex;
    justify-content:flex-end;
  }
  .heatmap{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(11px,1fr));
    gap:3px;
  }
  .cell{
    aspect-ratio:1;
    border-radius:2px;
    background:var(--panel-2);
  }
  .cell[data-l="1"]{background:#3c3423;}
  .cell[data-l="2"]{background:#6b5527;}
  .cell[data-l="3"]{background:#a3812f;}
  .cell[data-l="4"]{background:var(--amber);}
  .heatmap-legend{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:10px;
  }
  .legend-cell{width:10px;height:10px;border-radius:2px;}
  .entries{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .entry{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;padding-bottom:0;}
  .entry-main{flex:1;min-width:0;}
  .entry-date{
    font-size:0.75rem;
    color:var(--muted);
  }
  .entry-subject{
    font-weight:600;
    margin:2px 0;
  }
  .entry-notes{
    color:var(--muted);
    font-size:0.85rem;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .entry-side{
    text-align:right;
    white-space:nowrap;
  }
  .entry-mins{
    color:var(--amber);
    font-weight:600;
    font-size:0.9rem;
  }
  .entry-del{
    display:block;
    margin-top:6px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.75rem;
    cursor:pointer;
    padding:0;
  }
  .entry-del:hover{color:#c17;}
  .empty{
    color:var(--muted);
    font-size:0.9rem;
    text-align:center;
    padding:20px 0;
  }
  .footer-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:8px;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#f6f4ef;
      --panel:#ffffff;
      --panel-2:#f1efe9;
      --line:#e2ddd1;
      --ink:#211d15;
      --muted:#7a7466;
      --amber-dim:#e9d8b8;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Study Log</h1>
  <p class="sub">A private record of days studied and time spent. Stored only in this browser.</p>

  <div class="stats">
    <div class="stat"><div class="num" id="statHours">0</div><div class="lbl">hours logged</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">day streak</div></div>
    <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">days this year</div></div>
  </div>

  <div class="panel">
    <h2>Log a session</h2>
    <form id="logForm">
      <div>
        <label for="fDate">Date</label>
        <input type="date" id="fDate" required>
      </div>
      <div>
        <label for="fMinutes">Minutes</label>
        <input type="number" id="fMinutes" min="1" step="1" placeholder="45" required>
      </div>
      <div class="full">
        <label for="fSubject">Subject</label>
        <input type="text" id="fSubject" placeholder="e.g. AP World History — Unit 3" required>
      </div>
      <div class="full">
        <label for="fNotes">What you studied</label>
        <textarea id="fNotes" placeholder="Optional — key topics, what clicked, what to revisit"></textarea>
      </div>
      <div class="row-end">
        <button type="submit" class="btn-primary">Add entry</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>This year</h2>
    <div class="heatmap" id="heatmap"></div>
    <div class="heatmap-legend">
      <span>Less</span>
      <span class="legend-cell" style="background:var(--panel-2)"></span>
      <span class="legend-cell" style="background:#3c3423"></span>
      <span class="legend-cell" style="background:#6b5527"></span>
      <span class="legend-cell" style="background:#a3812f"></span>
      <span class="legend-cell" style="background:var(--amber)"></span>
      <span>More</span>
    </div>
  </div>

  <div class="panel">
    <h2>Entries</h2>
    <div class="entries" id="entries"></div>
  </div>

  <div class="footer-actions">
    <button class="btn-ghost" id="exportBtn">Export backup (.json)</button>
    <button class="btn-ghost" id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'study-log-entries';

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function save(entries){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('Could not save', e); }
  }

  let entries = load();

  const fDate = document.getElementById('fDate');
  const fMinutes = document.getElementById('fMinutes');
  const fSubject = document.getElementById('fSubject');
  const fNotes = document.getElementById('fNotes');
  const form = document.getElementById('logForm');
  const entriesEl = document.getElementById('entries');
  const heatmapEl = document.getElementById('heatmap');
  const statHours = document.getElementById('statHours');
  const statStreak = document.getElementById('statStreak');
  const statDays = document.getElementById('statDays');

  fDate.valueAsDate = new Date();

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!fDate.value || !fMinutes.value || !fSubject.value.trim()) return;
    entries.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      date: fDate.value,
      minutes: parseInt(fMinutes.value, 10),
      subject: fSubject.value.trim(),
      notes: fNotes.value.trim()
    });
    entries.sort((a,b)=> b.date.localeCompare(a.date));
    save(entries);
    fMinutes.value = '';
    fSubject.value = '';
    fNotes.value = '';
    fDate.valueAsDate = new Date();
    render();
  });

  entriesEl.addEventListener('click', function(e){
    const btn = e.target.closest('.entry-del');
    if(!btn) return;
    const id = btn.dataset.id;
    entries = entries.filter(en => en.id !== id);
    save(entries);
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    const blob = new Blob([JSON.stringify(entries, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'study-log-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function(){
    importFile.click();
  });
  importFile.addEventListener('change', function(){
    const file = importFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const imported = JSON.parse(reader.result);
        if(!Array.isArray(imported)) throw new Error('bad format');
        const byId = {};
        entries.concat(imported).forEach(en => { if(en && en.id) byId[en.id] = en; });
        entries = Object.values(byId).sort((a,b)=> b.date.localeCompare(a.date));
        save(entries);
        render();
      }catch(err){
        alert('Could not read that file as a study log backup.');
      }
    };
    reader.readAsText(file);
    importFile.value = '';
  });

  function formatDate(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  }

  function render(){
    // stats
    const totalMinutes = entries.reduce((s,en)=> s + en.minutes, 0);
    statHours.textContent = (totalMinutes/60).toFixed(1);

    const uniqueDates = Array.from(new Set(entries.map(en=>en.date))).sort();
    const thisYear = new Date().getFullYear().toString();
    statDays.textContent = uniqueDates.filter(d => d.startsWith(thisYear)).length;

    // streak: consecutive days up to today
    const dateSet = new Set(uniqueDates);
    let streak = 0;
    let cursor = new Date();
    while(true){
      const iso = cursor.toISOString().slice(0,10);
      if(dateSet.has(iso)){
        streak++;
        cursor.setDate(cursor.getDate()-1);
      } else if (streak===0 && iso === new Date().toISOString().slice(0,10)) {
        // today has no entry yet, check yesterday onward without breaking
        cursor.setDate(cursor.getDate()-1);
        const y = cursor.toISOString().slice(0,10);
        if(!dateSet.has(y)) break;
      } else {
        break;
      }
    }
    statStreak.textContent = streak;

    // heatmap for current year
    const minutesByDate = {};
    entries.forEach(en=>{ minutesByDate[en.date] = (minutesByDate[en.date]||0) + en.minutes; });
    heatmapEl.innerHTML = '';
    const year = new Date().getFullYear();
    const start = new Date(year,0,1);
    const end = new Date(year,11,31);
    for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
      const iso = d.toISOString().slice(0,10);
      const mins = minutesByDate[iso] || 0;
      let level = 0;
      if(mins>0) level=1;
      if(mins>=30) level=2;
      if(mins>=60) level=3;
      if(mins>=120) level=4;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.l = level;
      cell.title = iso + (mins ? ' — ' + mins + ' min' : '');
      heatmapEl.appendChild(cell);
    }

    // entries list
    entriesEl.innerHTML = '';
    if(entries.length === 0){
      entriesEl.innerHTML = '<div class="empty">No sessions logged yet. Add your first one above.</div>';
      return;
    }
    entries.forEach(en=>{
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML =
        '<div class="entry-main">' +
          '<div class="entry-date">' + formatDate(en.date) + '</div>' +
          '<div class="entry-subject"></div>' +
          (en.notes ? '<div class="entry-notes"></div>' : '') +
        '</div>' +
        '<div class="entry-side">' +
          '<div class="entry-mins">' + en.minutes + ' min</div>' +
          '<button class="entry-del" data-id="' + en.id + '">Delete</button>' +
        '</div>';
      row.querySelector('.entry-subject').textContent = en.subject;
      if(en.notes) row.querySelector('.entry-notes').textContent = en.notes;
      entriesEl.appendChild(row);
    });
  }

  render();
})();
</script>
</body>
</html>
